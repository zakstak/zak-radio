# Music agent requests use app-owned bearer validation. Browser requests with
# SSO cookies retain the existing auth_request flow and trusted identity.
map "$request_method:$uri:$http_authorization:$http_cookie" $zak_radio_agent_request {
    default 0;
    ~^(GET|HEAD):/(ai[.]json|[.]well-known/ai[.]json): 1;
    ~^GET:/api/song-upload/openapi[.]json: 1;
    ~^GET:/api/song-upload:(?i:Bearer)[[:space:]]+ 1;
    ~^POST:/api/tracks:(?i:Bearer)[[:space:]]+ 1;
    "GET:/api/song-upload::" 1;
    "POST:/api/tracks::" 1;
}

server {
    listen 10.0.1.110:443 ssl;
    server_name music.home.zakstak.com;
    ssl_certificate /etc/saga-kiln-https/tls/current/tls.crt;
    ssl_certificate_key /etc/saga-kiln-https/tls/current/tls.key;
    access_log off;
    client_max_body_size 16k;

    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4183;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Host music.home.zakstak.com;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URL https://music.home.zakstak.com$request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host music.home.zakstak.com;
    }

    location @login { return 302 /oauth2/start?rd=https://music.home.zakstak.com$request_uri; }

    location /oauth2/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:4183;
        proxy_pass_request_headers off;
        proxy_set_header Host music.home.zakstak.com;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host music.home.zakstak.com;
    }

    location = /api/tracks {
        client_max_body_size 33m;
        error_page 418 = @zak_radio_agent;
        if ($zak_radio_agent_request) { return 418; }
        if ($request_method !~ ^(GET|HEAD|POST|PATCH|DELETE)$) { return 405; }
        auth_request /oauth2/auth;
        auth_request_set $pyre_zak_radio_user $upstream_http_x_auth_request_preferred_username;
        error_page 401 = @login;
        proxy_pass http://unix:/run/saga-kiln-https/routes.sock:;
        proxy_set_header X-Kiln-Ingress hostname-v1;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host music.home.zakstak.com;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-Groups "";
        proxy_set_header X-Zakstak-Authenticated-User $pyre_zak_radio_user;
    }


    location / {
        error_page 418 = @zak_radio_agent;
        if ($zak_radio_agent_request) { return 418; }
        if ($request_method !~ ^(GET|HEAD|POST|PATCH|DELETE)$) { return 405; }
        auth_request /oauth2/auth;
        auth_request_set $pyre_zak_radio_user $upstream_http_x_auth_request_preferred_username;
        error_page 401 = @login;
        proxy_pass http://unix:/run/saga-kiln-https/routes.sock:;
        proxy_set_header X-Kiln-Ingress hostname-v1;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host music.home.zakstak.com;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-Groups "";
        proxy_set_header X-Zakstak-Authenticated-User $pyre_zak_radio_user;
    }


    location @zak_radio_agent {
        client_max_body_size 33m;
        proxy_read_timeout 130s;
        proxy_pass http://unix:/run/saga-kiln-https/routes.sock:;
        proxy_set_header X-Kiln-Ingress hostname-v1;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host music.home.zakstak.com;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-Groups "";
        proxy_set_header X-Zakstak-Authenticated-User "";
    }}

server {
    listen 10.0.1.110:443 ssl;
    server_name music-314a5651.home.zakstak.com zak-radio-c4c4cc7a.home.zakstak.com;
    ssl_certificate /etc/saga-kiln-https/tls/current/tls.crt;
    ssl_certificate_key /etc/saga-kiln-https/tls/current/tls.key;
    access_log off;
    etag off;
    location / {
        error_page 418 =308 /redirect-body;
        return 418;
    }
    location = /redirect-body {
        internal;
        root /usr/local/lib/saga-admission-rp-zak-radio;
        add_header Location "https://music.home.zakstak.com$request_uri" always;
    }
}
