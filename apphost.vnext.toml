schema = "apphost.vnext.manifest.v1"
name = "music"
shape = "web-service"
retention = "promoted"
owner = "saga"

[web-service]
context = ".apphost-package"
port = 8787
health-path = "/health"

[[volumes]]
mount-path = "/data/zak-radio"
retention = "retainOnDestroy"
backup-policy = "require"
shape = "directory"
size-limit-bytes = 10737418240
read-only = false
