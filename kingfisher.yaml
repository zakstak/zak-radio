# kingfisher.yaml — generated by `kingfisher config init`.
# Edit freely; CLI flags always override config values.
---
filters:
  exclude:
    - "**/go.sum"
    - "**/Cargo.lock"
    - "**/bun.lock"
    - "**/package-lock.json"
  skip_regex:
    - EXAMPLE[_-]?API[_-]?KEY
    - test[_-]?api[_-]?key
    - sk-[a-zA-Z0-9]{6}\.{3}
    - claude-[a-z]+-\d+-\d{8}
    - gpt-\d+[a-z-]*
    - gemini-[a-z0-9-]+
